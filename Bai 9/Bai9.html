<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LKWebsite</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="link-container">
        <h2>Liên kết website</h2>
        <form name="websiteForm">
            <select name="websites" id="websites" onchange="goToWebsite()">
                <option value="#">------ Tin tức ------</option>
                <option value="http://www.laodong.com.vn">Báo lao động</option>
                <option value="http://www.vnexpress.net">Tin nhanh Việt Nam</option>
                <option value="http://www.tuoitre.com.vn">Báo Tuổi Trẻ</option>
            </select>
        </form>
    </div>

    <script>
        function goToWebsite() {
            var website = document.websiteForm.websites.value;
            if (website !== "#") {
                window.location.href = website;
            }
        }
    </script>
</body>
</html>
