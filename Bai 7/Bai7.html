<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="feedback-container">
        <h2>ĐÓNG GÓP Ý KIẾN</h2>
        <form action="#" method="post">
            <table>
                <tr>
                    <td><label for="fullname">Họ và tên:</label></td>
                    <td ><input type="text" id="fullname" name="fullname" value="Lương Trần Hỷ Hiền"></td>
                </tr>
                <tr>
                    <td colspan="2"><label for="feedback">Nội dung góp ý:</label></td>
                </tr>
                <tr>
                    <td></td>
                    <td><textarea id="feedback" name="feedback" rows="5"></textarea></td>
                </tr>
                <tr >
                    <td colspan="2" align="center">
                        <input type="submit" value="Gửi đi">
                        <input type="reset" value="Nhập lại">
                    </td>
                </tr>
            </table>
        </form>
    </div>
</body>
</html>
