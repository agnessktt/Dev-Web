<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="survey-container">
        <h2>PHIẾU THĂM DÒ Ý KIẾN</h2>
        <form action="#" method="post">
            <table>
                <tr>
                    <td><label for="username">Tên đăng nhập:</label></td>
                    <td><input type="text" id="username" name="username"></td>
                    <td><label>Giới tính:</label></td>
                    <td>
                        <input type="radio" id="male" name="gender" value="male">
                        <label for="male">Nam</label>
                        <input type="radio" id="female" name="gender" value="female">
                        <label for="female">Nữ</label>
                    </td>
                </tr>
                <tr>
                    <td colspan="4"><label>Những mục bạn thường quan tâm trên Internet:</label></td>
                </tr>
                <tr>
                    <td colspan="4">
                        <input type="checkbox" id="news" name="interest" value="news">
                        <label for="news">Tin tức</label><br>
                        <input type="checkbox" id="entertainment" name="interest" value="entertainment">
                        <label for="entertainment">Giải trí</label><br>
                        <input type="checkbox" id="study" name="interest" value="study">
                        <label for="study">Góc học tập</label><br>
                        <input type="checkbox" id="other" name="interest" value="other">
                        <label for="other">Các mục khác</label>
                    </td>
                </tr>
                <tr>
                    <td colspan="4">
                        <input type="submit" value="Gửi đi">
                        <input type="reset" value="Phục hồi">
                    </td>
                </tr>
            </table>
        </form>
    </div>
</body>
</html>
